syntax = "proto3";

package eap.v2;

import "common.proto";
import "entity.proto";
import "entitydef.proto";
import "query.proto";
import "events.proto";
import "file.proto";

option go_package = "github.pie.apple.com/claris-ng/ng-data-eap/pkg/v2/rpc";

enum ResponseStatus {
  RESERVED = 0;
  SUCCESS = 1;
  FAILURE = 2;
}

message CreateRequest {
  RequestID req_id = 1;
  oneof body {
    EntityDef entity_def = 2;
    Entity entity = 3;
  }
}

message CreateResponse {
  ResponseStatus status = 1;
  oneof body {
    Error error = 2;
    int64 id = 3;
  }
}

message UpdateRequest {
  RequestID req_id = 1;
  oneof body {
    EntityDef entity_def = 2;
    Entity entity = 3;
    UpdateFields fields = 4;
  }
}

message UpdateResponse {
  ResponseStatus status = 1;
  oneof body {
    Error error = 2;
  }
}

message GetRequest {
  RequestID req_id = 1;
  oneof body {
    Query query = 2;
  }
}

message GetResponse {
  ResponseStatus status = 1;
  oneof body {
    Error error = 2;
    EntityDef entity_def = 3;
    Entity entity = 4;
  }
}

message DeleteRequest {
  RequestID req_id = 1;
  oneof body {
    Query query = 2;
  }
}

message DeleteResponse {
  ResponseStatus status = 1;
  oneof body {
    Error error = 2;
    EntityDef entity_def = 3;
    Entity entity = 4;
  }
}

message RequestID {
  int64 org_id = 1;
  int64 user_id = 2;
}

message Error {
  enum Code {
    RESERVED = 0;
    RECORD_NOT_FOUND = 1;
    DB_CONNECTION_ERROR = 2;
    DB_WRITE_ERROR = 3;
    BAD_ITEM = 4;
    ENCRYPTION_ERROR = 5;
    UNSUPPORTED_ACTION = 6;
    VALIDATION_FAILED = 7;
    ILLEGAL_QUERY = 8;
    INTERNAL_ERROR = 9;
    AUTH_ERROR = 10;
  }
  Code code = 1;
  string msg = 2;
}

message UpdateFields {
  DataType type = 1;
  int64 id = 2;
  bytes set = 3;
  bytes append = 4;
  bytes remove = 5;
  oneof params {
    EntityQueryParams entity = 6;
  }
}

message GetFileRequest {
  RequestID req_id = 1;
  bool get_content = 2;
  Query query = 3;
}

message GetFileResponse {
  ResponseStatus status = 1;
  oneof body {
    Error error = 2;
    File file = 3;
  }
}

service EntityAccessPipeline {
  rpc Create(CreateRequest) returns (CreateResponse) {}
  rpc Update(UpdateRequest) returns (UpdateResponse) {}
  rpc Get(GetRequest) returns (stream GetResponse) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  rpc Events(EventFilter) returns (stream Event) {}
  rpc GetFile(GetFileRequest) returns (stream GetFileResponse) {}
}
