plugins {
    id 'com.android.application' version '8.11.0'
    id 'org.jetbrains.kotlin.android' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}

android {
    namespace 'dev.openmaker.go'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.openmaker.go'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1'
        // The engine is built for ARM64 only (mobile/build-core.sh).
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The engine's bindings and library, from `mobile/build-core.sh android`.
    sourceSets.main.java.srcDir '../build/android/bindings'
    sourceSets.main.jniLibs.srcDir '../build/android/lib'
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

dependencies {
    // UniFFI's Kotlin bindings call the engine through JNA.
    implementation 'net.java.dev.jna:jna:5.19.1@aar'
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    // ExploreByTouchHelper, for TalkBack over the layout's fields and buttons.
    implementation 'androidx.customview:customview:1.1.0'
}
