[package]
name = "om-gui"
# `cargo run -p om-gui` runs the client, not its PDF worker (src/bin).
default-run = "om-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
om-data = { path = "../om-data" }
om-layout = { path = "../om-layout" }
om-report = { path = "../om-report" }
om-provider = { path = "../om-provider" }
om-url = { path = "../om-url" }
# The PDF worker executable's limiting allocator (om-gui-pdf-worker; MIT OR Apache-2.0).
cap = "0.1"
# Import Records, Export Records, Save Records as Excel.
om-transfer = { path = "../om-transfer" }
# Bundled emoji/icon fonts, so toolbar glyphs render the same on every platform.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Raster library images and tables. Not its `svg` feature: Browse draws SVG
# in the SVG worker (`svg_loader`), never in this process.
egui_extras = { version = "0.37", features = ["image"] }
# Read unrounded font metrics for native paragraph leading (also used by epaint).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
zeroize = "1"
# Portable vector PDF output, embedded TrueType metrics, and atomic replacement.
# pdf-writer and ttf-parser are MIT OR Apache-2.0; tempfile is MIT OR Apache-2.0.
pdf-writer = "0.15"
ttf-parser = "0.25"
tempfile = "3"
# The desktop's settings file (settings.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Static report pictures: the decoder Browse already uses (via egui_extras),
# and zlib streams for their PDF image XObjects. Both MIT OR Apache-2.0.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
flate2 = "1.1"
# SVG pictures and button icons, in Browse and reports, drawn in the SVG
# worker (their text in the bundled fonts; resvg: MIT OR Apache-2.0).
# Without `raster-images`: no raster image an SVG embeds is decoded.
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
# Tokenize only the SVG prolog and root tag to place the icon tint.
quick-xml = "0.41"
# The root viewport's native window, which web viewers are children of
# (the version eframe uses; MIT OR Apache-2.0 OR Zlib).
raw-window-handle = "0.6"
# Diagnostics from the client and its event loop.
log = { version = "0.4", features = ["std"] }

# Phone and tablet shells supply their own window and event loop.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
eframe = "0.37"
winit = { version = "0.30", default-features = false }
# The `om-gui` program's error reports (`om_server::reporting`, shared
# with om-server); already in the workspace through om-provider.
om-server = { path = "../om-server", default-features = false, features = ["sentry"] }

[features]
# Embedded web viewers: WebKitGTK through wry on Linux/X11 (through XWayland
# on a Wayland session), WKWebView through wry on macOS. Building it on Linux
# needs the WebKitGTK 4.1 and GTK 3 development files (Debian/Ubuntu:
# libwebkit2gtk-4.1-dev) and pkg-config; running it, the WebKitGTK 4.1
# runtime. Without it, web viewers show a note and their script steps fail.
# On a Linux Wayland session the pages are drawn by the page host
# (`om-gui-webview`, built with the feature) on a display of the app's own
# (smithay) and painted as textures in native Wayland windows; on an X11
# session, or with OPENMAKER_WEB_VIEWER_BACKEND=x11, the windows are on
# winit's X11 backend (XWayland on a Wayland session) with child windows.
# On X11, DRI3 tells which GPU driver the X server shares buffers with
# (`web_viewer::gtk::prepare_environment`).
web-viewer = ["dep:wry", "dep:gtk", "dep:gdkx11", "dep:webkit2gtk", "dep:javascriptcore-rs", "winit/x11", "dep:x11-dl", "dep:xkbcommon-dl", "dep:getrandom", "x11rb/dri3", "dep:smithay", "dep:wayland-client"]

[target.'cfg(unix)'.dependencies]
# Nonblocking open before checking local Insert/URL files, including FIFOs.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
# The system menu bar (Apache-2.0 OR MIT).
muda = { version = "0.21", default-features = false }
# The `web-viewer` feature's backend (wry: MIT OR Apache-2.0).
wry = { version = "0.58", default-features = false, features = ["os-webview"], optional = true }
# AppKit (the versions wry uses; MIT): the views web viewers place pages
# in, the open and save panels (`file_panel`), the Edit menu's text
# pasteboard, and display work areas.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-uniform-type-identifiers", "NSApplication", "NSEvent", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSSavePanel", "NSScreen", "NSView", "NSWindow"] }
# The panels' file type, by extension (`file_panel`; the objc2 version
# objc2-app-kit 0.3 uses; MIT OR Zlib OR Apache-2.0).
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSKeyValueCoding", "NSObject", "NSString", "NSURL", "NSValue"] }
block2 = "0.6"
# The web viewer bridge's tokens (the version om-data uses; MIT OR Apache-2.0).
getrandom = { version = "0.2.17", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
x11rb = "0.13"
# The desktop's file chooser through xdg-desktop-portal (`file_panel`): the
# D-Bus library and version eframe's accessibility already builds
# (accesskit_unix), with its blocking calls (MIT).
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# The `web-viewer` feature's backend (wry and gtk-rs: MIT OR Apache-2.0).
wry = { version = "0.58", default-features = false, features = ["os-webview"], optional = true }
gtk = { version = "0.19", optional = true }
gdkx11 = { version = "0.19", optional = true }
# The page's message handler, pinned to the versions wry uses (wry's own
# IPC drops messages from pages whose URL has no authority, as data: URLs).
webkit2gtk = { version = "=3.0.0", features = ["v2_38"], optional = true }
javascriptcore-rs = { version = "=2.0.0", features = ["v2_28"], optional = true }
# The libraries winit's X11 backend opens, looked for before choosing it (the
# loaders and versions winit uses; MIT).
x11-dl = { version = "2.19.1", optional = true }
xkbcommon-dl = { version = "0.4", features = ["x11"], optional = true }
# The page host's display for the Wayland backend (`web_viewer/wayland`): a
# compositor library (MIT) with its own default features off, for its Wayland
# server side only (wayland-server, calloop, xkbcommon), no renderer or
# hardware backend.
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"], optional = true }
# The session's keymap for the page host's keyboard (`web_viewer/wayland/
# keymap.rs`): the Wayland client library winit already uses (MIT).
wayland-client = { version = "0.31", optional = true }

[dev-dependencies]
# om-crypto, om-formula, om-hbam and om-scripts for the in-memory Tasks file of
# om-server's tests (tests/client_finds.rs); om-scsu for its data sources
# (tests/related_files.rs).
om-crypto = { path = "../om-crypto" }
om-formula = { path = "../om-formula" }
om-hbam = { path = "../om-hbam" }
om-giop = { path = "../om-giop" }
om-protocol = { path = "../om-protocol" }
om-scripts = { path = "../om-scripts" }
om-scsu = { path = "../om-scsu" }
om-server = { path = "../om-server" }
rcgen = "0.13"
# Headless UI testing and offscreen PNG rendering (software Vulkan via lavapipe).
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Rasterize generated report PDFs in tests (as om-calc does for containers).
hayro = "0.8"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# AppKit tests for web viewers, the system menu bar and the file panels.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-uniform-type-identifiers", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Real pointer input for the web viewer test (XTest).
x11rb = { version = "0.13", features = ["xtest"] }
# eframe's event loop on a test thread (the version eframe uses).
winit = { version = "0.30", default-features = false, features = ["x11"] }

# The system menu bar in the real event loop (macOS): one eframe event loop
# per process, on the main thread.
[[test]]
name = "system_menu_native"
harness = false

# Web viewers in the real event loop under an X server: one eframe event
# loop per process, on the main thread.
[[test]]
name = "insert_panel_native"
harness = false

# File > Open's and Create New's system panels (macOS), the same way.
[[test]]
name = "file_panels_native"
harness = false

# The Wayland backend's page host (`web_viewer::host`), run from beside
# `om-gui`.
[[bin]]
name = "om-gui-webview"
path = "src/bin/om-gui-webview.rs"
required-features = ["web-viewer"]

[[test]]
name = "web_viewer_native"
harness = false
required-features = ["web-viewer"]

# A second window's and List rows' pages, the same way.
[[test]]
name = "web_viewer_windows_native"
harness = false
required-features = ["web-viewer"]

# Pages painted as textures (the Wayland backend) in the real event loop
# under an X server, with the page host this build makes.
[[test]]
name = "web_viewer_composited"
harness = false
required-features = ["web-viewer"]

[lints]
workspace = true
