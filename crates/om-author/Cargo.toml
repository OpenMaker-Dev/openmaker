[package]
name = "om-author"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent-facing FileMaker solution authoring: a versioned JSON service, a CLI and an MCP server"

[[bin]]
name = "om-author"
path = "src/main.rs"

[dependencies]
om-data = { path = "../om-data" }
om-hbam = { path = "../om-hbam" }
om-layout = { path = "../om-layout" }
om-protocol = { path = "../om-protocol" }
om-provider = { path = "../om-provider" }
om-scripts = { path = "../om-scripts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# The official MCP Rust SDK: a stdio server with tools, no HTTP transport.
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std"] }

[dev-dependencies]
om-crypto = { path = "../om-crypto" }
om-formula = { path = "../om-formula" }
om-giop = { path = "../om-giop" }
om-server = { path = "../om-server" }
om-session = { path = "../om-session" }
rcgen = "0.14"

[lints]
workspace = true
